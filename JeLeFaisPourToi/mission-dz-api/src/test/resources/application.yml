# Profil de test : H2 en mémoire, pour que `mvn test` ne dépende d'aucune base externe.
# À revoir à l'étape CI/CD (Testcontainers + Postgres réel) une fois Docker disponible.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:mem:missiondz;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # Schéma généré par Hibernate à partir des entités, indépendamment de Flyway : suffisant
      # pour les tests avec H2. À remplacer par Testcontainers + Postgres + vraie migration
      # Flyway une fois Docker disponible (le schéma auto-généré peut diverger du réel).
      ddl-auto: create-drop
  flyway:
    enabled: false

security:
  jwt:
    secret: "test-only-secret-do-not-use-outside-automated-tests-1234567890"
    access-token-ttl: 15m
    refresh-token-ttl: 30d
