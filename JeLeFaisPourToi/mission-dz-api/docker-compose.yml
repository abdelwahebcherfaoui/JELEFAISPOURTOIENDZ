services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-missiondz}
      POSTGRES_USER: ${DB_USER:-missiondz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-missiondz}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-missiondz}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: ${DB_NAME:-missiondz}
      DB_USER: ${DB_USER:-missiondz}
      DB_PASSWORD: ${DB_PASSWORD:-missiondz}
      JWT_SECRET: ${JWT_SECRET:?la variable JWT_SECRET doit être définie (voir .env.example)}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
